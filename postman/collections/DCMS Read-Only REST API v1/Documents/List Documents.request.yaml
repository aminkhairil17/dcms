$kind: http-request
name: List Documents
order: 1000
method: GET
url: '{{baseUrl}}/api/v1/documents'
description: |-
  List documents. Supports full-text search, filtering, sorting and pagination.
  Response uses the standard envelope: { success, message, data, meta }.
queryParams:
  - key: q
    value: ''
    description: Full-text search (title, code_number, description).
    disabled: true
  - key: category
    value: ''
    description: Category name or prefix (partial match).
    disabled: true
  - key: status
    value: ''
    description: Document status (draft|pending_kabid|pending_direktur|approved|rejected|archived).
    disabled: true
  - key: sortBy
    value: 'created_at'
    description: 'Field to sort by (default: created_at).'
    disabled: true
  - key: order
    value: 'desc'
    description: 'Sort direction asc|desc (default: desc).'
    disabled: true
  - key: page
    value: '1'
    description: 'Page number (default: 1).'
    disabled: true
  - key: limit
    value: '10'
    description: 'Records per page, max 100 (default: 10).'
    disabled: true
