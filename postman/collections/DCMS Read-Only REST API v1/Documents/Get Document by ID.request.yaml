$kind: http-request
name: Get Document by ID
order: 2000
method: GET
url: '{{baseUrl}}/api/v1/documents/:id'
description: |-
  Get a single document by its numeric ID.
  The path variable `:id` is the document ID (numeric).
  Response uses the standard envelope: { success, message, data, meta }.
pathVariables:
  - key: id
    value: '1'
    description: The document ID (numeric).
